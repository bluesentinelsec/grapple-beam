plugins {
    id "com.android.library"
}

def repositoryRoot = rootProject.projectDir.parentFile
def prefabHeaders = file("${buildDir}/generated/prefab-headers")
// SDL3's Java glue. Anything loading a library that contains SDL3 needs
// org.libsdl.app.SDLActivity present, or the process aborts on load — so
// these classes belong in the AAR beside the objects that ask for them.
def sdlJavaDir = file("${buildDir}/generated/sdl-java")
def packageVersion = new File(repositoryRoot, "VERSION").readLines()[0]
        .replaceFirst(/^[vV]/, "")
        .replaceFirst(/[ \t]*#.*$/, "")
        .trim()

version = packageVersion

android {
    namespace "com.example.sdl3staticextensions"
    compileSdk 35
    ndkVersion "27.2.12479018"

    defaultConfig {
        minSdk 21

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
        }

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared",
                          // Where the native build stages the public headers.
                          // Gradle's own copy task runs at preBuild, before
                          // CMake has fetched SDL3, so it cannot do this.
                          "-DGRAPPLE_ANDROID_PREFAB_HEADERS=${prefabHeaders.absolutePath}",
                          "-DGRAPPLE_ANDROID_JAVA_DIR=${sdlJavaDir.absolutePath}",
                          "-DGRAPPLE_BEAM_BUILD_APP=OFF",
                          "-DGRAPPLE_BEAM_BUILD_TESTS=OFF",
                          "-DGRAPPLE_BEAM_BUILD_BENCHMARKS=OFF",
                          "-DGRAPPLE_BEAM_WITH_CLI11=OFF",
                          "-DGRAPPLE_BEAM_WITH_JSON=OFF",
                          "-DGRAPPLE_BEAM_WITH_SPDLOG=OFF"
                targets "grapple"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    // SDL3's Java classes are compiled into the AAR alongside our own, so a
    // consumer gets org.libsdl.app.* by depending on this package and not by
    // being told to go and find SDL's Android project.
    sourceSets {
        main {
            java.srcDirs += sdlJavaDir
        }
    }

    buildFeatures {
        prefabPublishing true
    }

    prefab {
        grapple {
            headers prefabHeaders.absolutePath
        }
    }

    externalNativeBuild {
        cmake {
            path repositoryRoot.toPath().resolve("CMakeLists.txt").toFile()
            version "3.22.1"
        }
    }
}

// Prefab ships a header snapshot with the AAR: the public include/ tree plus a
// rendered version.hpp (Gradle-side equivalent of the CMake configure_file).
tasks.register("preparePrefabHeaders") {
    inputs.dir(new File(repositoryRoot, "include"))
    inputs.file(new File(repositoryRoot, "VERSION"))
    inputs.file(new File(repositoryRoot, "cmake/version.hpp.in"))
    outputs.dir(prefabHeaders)

    doLast {
        delete(prefabHeaders)
        copy {
            from new File(repositoryRoot, "include")
            into prefabHeaders
            include "**/*.h", "**/*.hpp"
        }

        def components = packageVersion.tokenize(".-")
        if (components.size() < 3 || !components.take(3).every { it ==~ /[0-9]+/ }) {
            throw new GradleException("VERSION must begin with numeric major.minor.patch")
        }

        def versionHeader = new File(repositoryRoot, "cmake/version.hpp.in").text
                .replace("@PROJECT_NAMESPACE@", "grapple")
                .replace("@PROJECT_VERSION_MAJOR@", components[0])
                .replace("@PROJECT_VERSION_MINOR@", components[1])
                .replace("@PROJECT_VERSION_PATCH@", components[2])
        def output = new File(prefabHeaders, "grapple/version.hpp")
        output.parentFile.mkdirs()
        output.text = versionHeader
    }
}

tasks.named("preBuild").configure {
    dependsOn("preparePrefabHeaders")
}

// The CMake configure is what copies SDL's Java sources into place, and
// Gradle would otherwise be free to compile Java before that had happened —
// leaving the classes out of the AAR, which is a failure that only appears
// later, at load time, on a device.
tasks.whenTaskAdded { task ->
    if (task.name.startsWith("configureCMake")) {
        tasks.matching { it.name ==~ /compile.*JavaWithJavac/ }.configureEach {
            dependsOn(task)
        }
    }
}
