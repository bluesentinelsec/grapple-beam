# Generated by cppboot (--with-web-ci)
# Web/Emscripten: build the wasm32 static library, the HTML5 canvas demo, and
# the browser test page; run the tests in headless Chrome via emrun; package
# the installed library with the demo bundled.
name: Web

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (Emscripten/browser)
    runs-on: ubuntu-latest
    timeout-minutes: 35

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install latest CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: latest
          ninjaVersion: latest

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Configure Debug
        run: >
          emcmake cmake -S . -B build/web-debug -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DGRAPPLE_BEAM_BUILD_TESTS=ON

      - name: Build Debug
        run: cmake --build build/web-debug --parallel

      - name: Test Debug in headless Chrome
        run: >
          emrun --browser=google-chrome
          --browser_args="--headless=new --no-sandbox --disable-gpu"
          --kill_exit --timeout 120
          build/web-debug/bin/grapple_web_test.html

      - name: Configure Release
        run: >
          emcmake cmake -S . -B build/web-release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DGRAPPLE_BEAM_BUILD_TESTS=ON

      - name: Build Release
        run: cmake --build build/web-release --parallel

      - name: Test Release in headless Chrome
        run: >
          emrun --browser=google-chrome
          --browser_args="--headless=new --no-sandbox --disable-gpu"
          --kill_exit --timeout 120
          build/web-release/bin/grapple_web_test.html

      - name: Verify canvas demo build
        run: |
          set -euo pipefail
          test -f build/web-release/bin/grapple-beam.html
          test -f build/web-release/bin/grapple-beam.js
          test -f build/web-release/bin/grapple-beam.wasm
          # emcc -O3 minifies the shell (strips attribute quotes); match the tag.
          grep -qi "<canvas" build/web-release/bin/grapple-beam.html

      - name: Verify the wasm SDK carries the engine
        run: |
          set -euo pipefail
          prefix="${PWD}/build/web-verify"
          cmake --install build/web-release --prefix "${prefix}"

          archive="${prefix}/lib/libgrapple_sdk.a"
          test -f "${archive}"
          size="$(stat -c%s "${archive}")"
          if [ "${size}" -lt 5000000 ]; then
            echo "${archive} is ${size} bytes — that is a placeholder, not the SDK" >&2
            exit 1
          fi

          # The shipped archive was 686 bytes for several releases while every
          # check in this workflow passed, because none of them looked inside.
          emar t "${archive}" > web-objects.txt
          for object in grapple_engine.c.o grapple_engine_actor.c.o SDL_video.c.o; do
            if ! grep -qx "${object}" web-objects.txt; then
              echo "Missing ${object} — the wasm SDK is not carrying the engine" >&2
              exit 1
            fi
          done

          for header in grapple/engine.h grapple/bindings.h SDL3/SDL.h; do
            test -f "${prefix}/include/${header}"
          done

      - name: Package web library and demo
        id: package
        run: |
          set -euo pipefail
          stem="grapple-beam-web-wasm32-release-$(tr -d "[:space:]" < VERSION | sed "s/^v//;s/^V//;s/#.*//")"
          prefix="${PWD}/dist/${stem}"
          cmake --install build/web-release --prefix "${prefix}"
          emcc --version | sed -n '1p' > "${prefix}/EMSCRIPTEN_VERSION"
          cp LICENSE "${prefix}/LICENSE"
          mkdir -p "${prefix}/demo"
          cp build/web-release/bin/grapple-beam.html build/web-release/bin/grapple-beam.js \
             build/web-release/bin/grapple-beam.wasm "${prefix}/demo/"
          (cd dist && zip -r "${stem}.zip" "${stem}" >/dev/null)
          echo "artifact_name=${stem}" >> "${GITHUB_OUTPUT}"
          echo "artifact_path=dist/${stem}.zip" >> "${GITHUB_OUTPUT}"

      - name: Upload web package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 14
