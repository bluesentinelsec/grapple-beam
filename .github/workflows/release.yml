# Generated by cppboot (default; --no-github-actions to skip)
# Create GitHub Releases from v* tags or workflow_dispatch.
# Version source of truth is the root VERSION file (must match tag / input).
# Attaches <app>-<os>-<arch>-release-<version>.zip and auto-generated notes.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semver without leading v (must match VERSION file; leave empty to use VERSION)"
        required: false
        type: string
        default: ""
      prerelease:
        description: "Mark as prerelease"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Build and draft only (do not publish release)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve tag and version (synced with VERSION file)
        id: meta
        env:
          INPUT_VERSION: ${{ github.event.inputs.version || '' }}
          INPUT_PRERELEASE: ${{ github.event.inputs.prerelease || 'false' }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          if [ ! -f VERSION ]; then
            echo "Missing VERSION file at repo root (single source of truth)."
            exit 1
          fi
          FILE_VERSION="$(tr -d '[:space:]' < VERSION | sed 's/^v//;s/^V//;s/#.*//')"
          if ! [[ "${FILE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "Invalid VERSION file contents: '${FILE_VERSION}' (expected semver like 1.0.0)"
            exit 1
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -z "${INPUT_VERSION}" ]; then
              VERSION="${FILE_VERSION}"
            else
              VERSION="${INPUT_VERSION#v}"
              VERSION="${VERSION#V}"
            fi
            if [ "${VERSION}" != "${FILE_VERSION}" ]; then
              echo "Release version '${VERSION}' does not match VERSION file '${FILE_VERSION}'."
              echo "Bump the VERSION file (and only that file), commit, then re-run the release."
              exit 1
            fi
            TAG="v${VERSION}"
            PRERELEASE="${INPUT_PRERELEASE}"
            DRY_RUN="${INPUT_DRY_RUN}"
            # Do not push tags here — that would re-trigger this workflow.
            # softprops/action-gh-release creates the tag on publish when missing.
          else
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
            VERSION="${VERSION#V}"
            PRERELEASE=false
            DRY_RUN=false
            if [[ "${TAG}" == *-* ]] || [[ "${TAG}" == *alpha* ]] || [[ "${TAG}" == *beta* ]] || [[ "${TAG}" == *rc* ]]; then
              PRERELEASE=true
            fi
            if [ "${VERSION}" != "${FILE_VERSION}" ]; then
              echo "Tag version '${VERSION}' does not match VERSION file '${FILE_VERSION}'."
              echo "Bump VERSION, commit, then tag v${FILE_VERSION} (or retag after fixing VERSION)."
              exit 1
            fi
          fi
          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "prerelease=${PRERELEASE}"
            echo "dry_run=${DRY_RUN}"
          } >> "${{ github.output }}"
          echo "Resolved release ${TAG} (version=${VERSION}, file=${FILE_VERSION}, prerelease=${PRERELEASE}, dry_run=${DRY_RUN})"

  build:
    name: build-${{ matrix.os }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    env:
      APP_NAME: grapple-beam
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install SDL3 Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpulse-dev libx11-dev \
            libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev \
            libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev \
            libudev-dev libwayland-dev libdecor-0-dev libpipewire-0.3-dev

      - name: Install latest CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: latest
          ninjaVersion: latest

      - name: Enable MSVC developer command prompt
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Configure Release
        run: >
          cmake -S . -B build/release -G Ninja
          -DCMAKE_BUILD_TYPE=Release

      - name: Build Release
        run: cmake --build build/release --parallel

      - name: Test Release
        run: ctest --test-dir build/release --output-on-failure --parallel

      - name: Verify binary version matches release
        run: |
          set -euo pipefail
          bin="build/release/bin/${APP_NAME}"
          if [ ! -x "${bin}" ] && [ -f "${bin}.exe" ]; then
            bin="${bin}.exe"
          fi
          if [ ! -f "${bin}" ]; then
            echo "Missing app binary at build/release/bin/${APP_NAME}"
            exit 1
          fi
          out="$("${bin}" --version 2>&1 || true)"
          echo "Binary --version output: ${out}"
          if ! echo "${out}" | grep -Eq "(^|[[:space:]])${RELEASE_VERSION}([[:space:]]|$)"; then
            echo "Version mismatch: expected ${RELEASE_VERSION} from VERSION/tag, got: ${out}"
            echo "Edit the root VERSION file only, reconfigure/rebuild, then release."
            exit 1
          fi
          file_ver="$(tr -d '[:space:]' < VERSION | sed 's/^v//;s/^V//;s/#.*//')"
          if [ "${file_ver}" != "${RELEASE_VERSION}" ]; then
            echo "VERSION file (${file_ver}) drifted from release version (${RELEASE_VERSION})."
            exit 1
          fi

      - name: Package Release SDK
        id: pkg
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION | sed 's/^v//;s/^V//;s/#.*//')"
          case "${RUNNER_OS}" in
            Linux) os=linux ;;
            macOS) os=macos ;;
            Windows) os=windows ;;
            *) os="$(echo "${RUNNER_OS}" | tr '[:upper:]' '[:lower:]')" ;;
          esac
          case "${RUNNER_ARCH}" in
            X64) arch=x86_64 ;;
            ARM64) arch=arm64 ;;
            X86) arch=x86 ;;
            *) arch="$(echo "${RUNNER_ARCH}" | tr '[:upper:]' '[:lower:]')" ;;
          esac
          stem="${APP_NAME}-${os}-${arch}-release-${version}"
          prefix="${PWD}/dist/${stem}"

          # From the install tree, not from bin/. Copying bin/ is how the
          # release came to be 99 MB of gtest binaries with no library in it.
          rm -rf "${prefix}"
          cmake --install build/release --prefix "${prefix}" --config Release

          # mbedtls installs its own archives with no upstream switch to stop
          # it, and we do not patch third-party projects. They are redundant —
          # their objects are already inside ours — and a consumer cannot tell
          # that by looking, so they are dropped here instead.
          for stray in libmbedtls libmbedx509 libmbedcrypto libeverest libp256m libmog; do
            rm -f "${prefix}/lib/${stray}."* || true
          done
          rm -rf "${prefix}/lib/cmake/mog" || true

          cp LICENSE "${prefix}/LICENSE"
          cp VERSION "${prefix}/VERSION"

          echo "artifact_name=${stem}" >> "${GITHUB_OUTPUT}"
          echo "artifact_path=dist/${stem}.zip" >> "${GITHUB_OUTPUT}"
          echo "prefix=${prefix}" >> "${GITHUB_OUTPUT}"

      - name: Verify the SDK before shipping it
        shell: bash
        run: |
          set -euo pipefail
          prefix="${{ steps.pkg.outputs.prefix }}"

          # Three artifacts, and a release that is missing one of them is a
          # release nobody can use for that half of the audience.
          # Two static archives and two shared libraries. A release missing
          # one of them is a release half the audience cannot use.
          for lib in grapple_sdk grapple_sdk_cxx; do
            found="$(find "${prefix}/lib" -name "*${lib}.*" -print -quit)"
            if [ -z "${found}" ]; then
              echo "Missing static ${lib} from the SDK" >&2
              exit 1
            fi
            size="$(wc -c <"${found}")"
            if [ "${size}" -lt 1000000 ]; then
              echo "${found} is ${size} bytes — a placeholder, not the SDK" >&2
              exit 1
            fi
          done

          for lib in grapple grapple_cxx; do
            found="$(find "${prefix}/lib" "${prefix}/bin" \
                       \( -name "lib${lib}.so*" -o -name "lib${lib}*.dylib" \
                          -o -name "${lib}.dll" \) -print -quit 2>/dev/null)"
            if [ -z "${found}" ]; then
              echo "Missing shared ${lib} from the SDK" >&2
              exit 1
            fi
          done

          # Loading it is not the test — a library that exports nothing loads
          # fine and fails on the first lookup, and on Windows a DLL with no
          # exports is a valid DLL. This calls into it.
          shared_c="$(find "${prefix}/lib" "${prefix}/bin" \
                        \( -name "libgrapple.so*" \
                           -o -name "libgrapple*.dylib" \
                           -o -name "grapple.dll" \) -print -quit 2>/dev/null)"
          python3 tests/ctypes/test_shared_library.py "${shared_c}"

          runner="${prefix}/bin/grapple"
          [ -f "${runner}" ] || runner="${prefix}/bin/grapple.exe"
          if [ ! -f "${runner}" ]; then
            echo "Missing the runner from the SDK" >&2
            exit 1
          fi

          for header in SDLStatic/engine.h SDL3/SDL.h; do
            test -f "${prefix}/include/${header}"
          done
          # The C++ headers live under a differently-cased directory, which is
          # one directory on macOS and two on Linux.
          find "${prefix}/include" -iname "sdlstatic.h" | grep -q . \
            || { echo "Missing the C++ headers" >&2; exit 1; }

          # The editor tooling, which is the difference between an API you
          # can complete and one you read in a browser tab.
          test -f "${prefix}/tags"
          test -f "${prefix}/share/${APP_NAME}/editor/sdlstatic.lua"
          test -f "${prefix}/share/${APP_NAME}/editor/sdlstatic.rbs"

          # Documentation. A library whose SDK explains nothing offline is a
          # library you can only use with a browser open.
          test -f "${prefix}/share/doc/${APP_NAME}/getting-started.md"
          test -f "${prefix}/share/doc/${APP_NAME}/scripting.md"
          test -f "${prefix}/share/doc/${APP_NAME}/SCRIPT_API.md"

          # No test binaries. They were the entire download for six releases.
          #
          # Scoped to bin/ and lib/, where a binary would land: searching the
          # whole prefix matches SDL3's own public SDL_test_*.h headers, which
          # belong there — the first version of this check failed the release
          # on them.
          if find "${prefix}/bin" "${prefix}/lib" \
                  \( -name "*_test*" -o -name "*_bench*" \) 2>/dev/null | grep -q .; then
            echo "Test binaries leaked into the SDK" >&2
            find "${prefix}/bin" "${prefix}/lib" \
                 \( -name "*_test*" -o -name "*_bench*" \) >&2
            exit 1
          fi

      # The runner on its own, for someone who wants to play a Lua or Ruby
      # game and never intends to compile anything. It carries the script
      # completions with it: an embedded API with no editor support is an
      # API read from a browser tab.
      - name: Package the runner
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION | sed 's/^v//;s/^V//;s/#.*//')"
          case "${RUNNER_OS}" in
            Linux) os=linux ;;
            macOS) os=macos ;;
            Windows) os=windows ;;
            *) os="$(echo "${RUNNER_OS}" | tr '[:upper:]' '[:lower:]')" ;;
          esac
          case "${RUNNER_ARCH}" in
            X64) arch=x86_64 ;;
            ARM64) arch=arm64 ;;
            *) arch="$(echo "${RUNNER_ARCH}" | tr '[:upper:]' '[:lower:]')" ;;
          esac
          stem="${APP_NAME}-runner-${os}-${arch}-release-${version}"
          out="${PWD}/dist/${stem}"
          rm -rf "${out}"
          mkdir -p "${out}/editor"

          sdk="${{ steps.pkg.outputs.prefix }}"
          if [ -f "${sdk}/bin/grapple.exe" ]; then
            cp "${sdk}/bin/grapple.exe" "${out}/"
          else
            cp "${sdk}/bin/grapple" "${out}/"
          fi
          cp "${sdk}/share/${APP_NAME}/editor/sdlstatic.lua" "${out}/editor/"
          cp "${sdk}/share/${APP_NAME}/editor/sdlstatic.rbs" "${out}/editor/"
          cp LICENSE "${out}/LICENSE"

          # The two pages a script author actually needs, offline: how to
          # write a game in Lua or Ruby, and the signature every bound
          # function has *as a script sees it*.
          mkdir -p "${out}/docs"
          cp "${sdk}/share/doc/${APP_NAME}/scripting.md" "${out}/docs/"
          cp "${sdk}/share/doc/${APP_NAME}/engine.md" "${out}/docs/"
          cp "${sdk}/share/doc/${APP_NAME}/SCRIPT_API.md" "${out}/docs/"

          cat > "${out}/README.md" <<'README'
          # The runner

          Plays a game written in Lua or Ruby. Nothing needs to be installed:
          the interpreters, the engine and SDL3 are inside the executable.

              ./grapple game.lua
              ./grapple game.rb
              ./grapple -l lua          # an interactive shell

          The language comes from the file's extension; `-l` says which when
          there is no file to infer it from.

          ## Completions

          `docs/` has the scripting guide, the engine guide, and the full
          signature of every bound function as a script sees it.

          `editor/` holds definitions generated from the same source as the
          bindings, so they describe exactly what this build exposes.

          **Lua** — lua-language-server, in `.luarc.json`:

              { "workspace": { "library": ["editor/sdlstatic.lua"] } }

          **Ruby** — RBS, for Steep or Solargraph: put `editor/sdlstatic.rbs`
          on your RBS path.
          README

          echo "runner_name=${stem}" >> "${GITHUB_OUTPUT}"
          echo "runner_path=dist/${stem}.zip" >> "${GITHUB_OUTPUT}"
        id: runner_pkg

      - name: Archive the SDK
        shell: bash
        run: |
          set -euo pipefail
          stem="${{ steps.pkg.outputs.artifact_name }}"

          # -y stores symbolic links as links. Without it, zip follows them
          # and writes a full copy for every name: the three
          # libfoo.so / .so.0 / .so.0.7.0 entries became three 16 MB files
          # in v0.7.0, and a consumer unpacking them got copies where their
          # linker expects a link.
          #
          # zip is preferred over 7z here rather than second: 7z dereferences
          # too, and running it first meant it won on Linux and macOS as well
          # as on Windows, which is the only platform that needs it.
          if command -v zip >/dev/null 2>&1; then
            (cd dist && zip -r -y "${stem}.zip" "${stem}" >/dev/null)
          else
            (cd dist && 7z a -tzip "${stem}.zip" "${stem}" >/dev/null)
          fi
          ls -lh "dist/${stem}.zip"

          # The links have to survive the round trip, which is invisible
          # until someone unpacks the archive — so unpack it here.
          if [ "${RUNNER_OS}" != "Windows" ]; then
            rm -rf dist/_linkcheck && mkdir -p dist/_linkcheck
            (cd dist/_linkcheck && unzip -q "../${stem}.zip")
            link="$(find "dist/_linkcheck/${stem}/lib" \
                      \( -name 'libgrapple.so' \
                         -o -name 'libSDL3_static_extensions.dylib' \) -print -quit)"
            if [ -z "${link}" ] || [ ! -L "${link}" ]; then
              echo "the shared library's version links were flattened into copies" >&2
              ls -l "dist/_linkcheck/${stem}/lib" >&2
              exit 1
            fi
            rm -rf dist/_linkcheck
          fi

      - name: Archive the runner
        shell: bash
        run: |
          set -euo pipefail
          stem="${{ steps.runner_pkg.outputs.runner_name }}"
          if command -v zip >/dev/null 2>&1; then
            (cd dist && zip -r -y "${stem}.zip" "${stem}" >/dev/null)
          else
            (cd dist && 7z a -tzip "${stem}.zip" "${stem}" >/dev/null)
          fi
          ls -lh "dist/${stem}.zip"

      - name: Upload the runner
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.runner_pkg.outputs.runner_name }}
          path: ${{ steps.runner_pkg.outputs.runner_path }}

      - name: Upload Release zip (workflow artifact)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pkg.outputs.artifact_name }}
          path: ${{ steps.pkg.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 14

  build-android:
    name: build-android (Prefab AAR / emulator)
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build Release AAR and consumer APK
        run: |
          bash android/gradlew -p android --no-daemon :SDL3_static_extensions:assembleRelease
          bash android/gradlew -p android --no-daemon :test-app:assembleRelease

      - name: Verify Release AAR version and ABIs
        run: |
          set -euo pipefail
          aar=android/SDL3_static_extensions/build/outputs/aar/SDL3_static_extensions-release.aar
          test -f "${aar}"
          unzip -Z1 "${aar}" > aar-entries.txt
          for abi in armeabi-v7a arm64-v8a x86_64; do
            grep -qx "prefab/modules/SDL3_static_extensions/libs/android.${abi}/libgrapple.so" aar-entries.txt
          done
          unzip -p "${aar}" prefab/prefab.json | grep -q "\"version\"[[:space:]]*:[[:space:]]*\"${RELEASE_VERSION}\""

          # Contents, not just shape. ABIs, paths and version were all true
          # of an AAR containing one object file, and a release is the worst
          # place to find that out.
          for header in SDLStatic/engine.h SDLStatic/bindings.h SDL3/SDL.h; do
            grep -qx "prefab/modules/SDL3_static_extensions/include/${header}" aar-entries.txt
          done
          mkdir -p aar-check && unzip -o -q "${aar}" -d aar-check
          so="aar-check/jni/arm64-v8a/libgrapple.so"
          size="$(stat -c%s "${so}")"
          if [ "${size}" -lt 5000000 ]; then
            echo "${so} is ${size} bytes — that is a placeholder, not the SDK" >&2
            exit 1
          fi
          nm -D --defined-only "${so}" > aar-symbols.txt
          for symbol in SDLStatic_CreateEngine SDLStatic_OpenLuaBindings SDL_CreateWindow; do
            if ! grep -qw "${symbol}" aar-symbols.txt; then
              echo "Missing ${symbol} — the AAR is not carrying the engine" >&2
              exit 1
            fi
          done

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Release package tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash scripts/run_android_tests.sh

      - name: Stage Android Release AAR
        id: pkg
        run: |
          set -euo pipefail
          stem="SDL3-static-extensions-android-release-${RELEASE_VERSION}"
          mkdir -p dist
          cp android/SDL3_static_extensions/build/outputs/aar/SDL3_static_extensions-release.aar "dist/${stem}.aar"
          echo "artifact_name=${stem}" >> "${GITHUB_OUTPUT}"
          echo "artifact_path=dist/${stem}.aar" >> "${GITHUB_OUTPUT}"

      - name: Upload Android Release AAR
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pkg.outputs.artifact_name }}
          path: ${{ steps.pkg.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 14

  build-ios:
    name: build-ios (XCFramework / simulator)
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 35
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install latest CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: latest
          ninjaVersion: latest

      - name: Build Release XCFramework and consumer apps
        run: |
          bash scripts/build_ios_xcframework.sh Release build/ios/release
          bash scripts/build_ios_test_apps.sh \
            build/ios/release/SDL3-static-extensions.xcframework Release build/ios/consumer-release

      - name: Verify Release XCFramework version and slices
        run: >
          bash scripts/verify_ios_xcframework.sh
          build/ios/release/SDL3-static-extensions.xcframework
          "${RELEASE_VERSION}"

      - name: Run Release package tests in iOS Simulator
        env:
          BUILD_DIR: build/ios/consumer-release/iphonesimulator
        run: bash scripts/run_ios_tests.sh

      - name: Upload iOS Release XCFramework
        uses: actions/upload-artifact@v7
        with:
          name: SDL3-static-extensions-ios-xcframework-release-${{ needs.prepare.outputs.version }}
          path: build/ios/release/SDL3-static-extensions-ios-xcframework-release-${{ needs.prepare.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 14

  build-web:
    name: build-web (Emscripten/browser)
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install latest CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: latest
          ninjaVersion: latest

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Configure Release
        run: >
          emcmake cmake -S . -B build/web-release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DSDL3_STATIC_EXTENSIONS_BUILD_TESTS=ON

      - name: Build Release
        run: cmake --build build/web-release --parallel

      - name: Test Release in headless Chrome
        run: >
          emrun --browser=google-chrome
          --browser_args="--headless=new --no-sandbox --disable-gpu"
          --kill_exit --timeout 120
          build/web-release/bin/SDL3_static_extensions_web_test.html

      - name: Package web library and demo
        id: pkg
        run: |
          set -euo pipefail
          stem="SDL3-static-extensions-web-wasm32-release-${RELEASE_VERSION}"
          prefix="${PWD}/dist/${stem}"
          cmake --install build/web-release --prefix "${prefix}"
          emcc --version | sed -n '1p' > "${prefix}/EMSCRIPTEN_VERSION"
          cp LICENSE "${prefix}/LICENSE"
          mkdir -p "${prefix}/demo"
          cp build/web-release/bin/SDL3-static-extensions.html build/web-release/bin/SDL3-static-extensions.js \
             build/web-release/bin/SDL3-static-extensions.wasm "${prefix}/demo/"
          (cd dist && zip -r -y "${stem}.zip" "${stem}" >/dev/null)
          echo "artifact_name=${stem}" >> "${GITHUB_OUTPUT}"
          echo "artifact_path=dist/${stem}.zip" >> "${GITHUB_OUTPUT}"

      - name: Upload web Release zip
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pkg.outputs.artifact_name }}
          path: ${{ steps.pkg.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 14

  build-docs:
    name: build-docs (HTML site)
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      # The same script the Pages deployment runs, so the offline copy and
      # the website cannot drift into being different documents.
      - name: Build the site
        run: bash scripts/build-docs.sh site

      - name: Package the docs
        id: pkg
        run: |
          set -euo pipefail
          stem="${APP_NAME}-docs-${{ needs.prepare.outputs.version }}"
          rm -rf "dist/${stem}"
          mkdir -p "dist/${stem}"
          cp -R site/. "dist/${stem}/"
          cp LICENSE "dist/${stem}/LICENSE"

          # The generated references are not part of the site build — they
          # come out of the binding generator — and they are the two pages a
          # script author needs most.
          cp bindings/generated/SCRIPT_API.md bindings/generated/COVERAGE.md \
             "dist/${stem}/"

          test -f "dist/${stem}/index.html"
          test -f "dist/${stem}/scripting.html"
          (cd dist && zip -r -y "${stem}.zip" "${stem}" >/dev/null)
          echo "artifact_name=${stem}" >> "${GITHUB_OUTPUT}"
          echo "artifact_path=dist/${stem}.zip" >> "${GITHUB_OUTPUT}"
        env:
          APP_NAME: grapple-beam

      - name: Upload the docs
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pkg.outputs.artifact_name }}
          path: ${{ steps.pkg.outputs.artifact_path }}

  publish:
    name: Publish GitHub Release
    needs: [prepare, build, build-android, build-ios, build-web, build-docs]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download build zips
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          pattern: "SDL3-static-extensions-*"
          merge-multiple: true

      - name: List assets
        run: |
          set -euo pipefail
          find release-assets -type f \( -name '*.zip' -o -name '*.aar' \) | tee assets.list
          test -s assets.list

      - name: Create GitHub Release
        if: needs.prepare.outputs.dry_run != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          files: |
            release-assets/**/*.zip
            release-assets/**/*.aar
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dry-run summary
        if: needs.prepare.outputs.dry_run == 'true'
        run: |
          echo "Dry run complete for ${{ needs.prepare.outputs.tag }} — assets:"
          find release-assets -type f \( -name '*.zip' -o -name '*.aar' \) -print
