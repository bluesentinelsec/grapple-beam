# Generated by cppboot (--with-ios-ci)
# iOS XCFramework: build static device (arm64) and simulator (arm64/x86_64)
# libraries, package and verify the XCFramework, and run the consumer package
# tests in an iOS Simulator.
#
# Two jobs, because the full run and the useful-on-every-PR run are different
# sizes:
#
#   ios-build   pull requests. Configures and builds the simulator SDK, and
#               nothing else — no device slice, no packaging, no simulator.
#               Roughly half the cost, and it catches the whole class of
#               failure that dispatch-only left undetected: a configure error
#               or a source file that does not compile for iOS. Both have
#               happened, and both reached main.
#   ios         manual dispatch. The full XCFramework: device and simulator
#               slices, packaging, verification and the simulator test run.
#               Still the batch validation before and after merges, and
#               release.yml's build-ios job is still the hard gate before a
#               release ships.
name: iOS

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The PR gate: does it configure, and does it compile?
  ios-build:
    name: iOS (simulator SDK builds)
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install latest CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Configure for the iOS Simulator
        run: >
          cmake -S . -B build/ios -G Xcode
          -DCMAKE_SYSTEM_NAME=iOS
          -DCMAKE_OSX_SYSROOT=iphonesimulator
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
          -DGRAPPLE_BEAM_BUILD_APP=OFF
          -DGRAPPLE_BEAM_BUILD_TESTS=OFF
          -DGRAPPLE_BEAM_BUILD_BENCHMARKS=OFF
          -DGRAPPLE_BEAM_WITH_CLI11=OFF
          -DGRAPPLE_BEAM_WITH_JSON=OFF
          -DGRAPPLE_BEAM_WITH_SPDLOG=OFF

      # Both SDK targets, so every component is compiled and the pair stays in
      # step. Building only one is what broke the full iOS run after the C++
      # SDK was added: the install found an archive nobody had built.
      - name: Build the SDKs
        run: >
          cmake --build build/ios --config Release
          --target Grapple_SDK Grapple_SDK_Cxx --parallel

      # The install rules, which the packaging script relies on to stage
      # headers. They are a different code path from the build and have
      # broken independently of it.
      - name: Install to a prefix
        run: cmake --install build/ios --config Release --prefix build/ios-prefix

      - name: Verify the archive carries the engine
        run: |
          set -euo pipefail
          archive="$(find build/ios -name libgrapple_sdk_cxx.a -print -quit)"
          test -n "${archive}"
          size="$(stat -f%z "${archive}")"
          if [ "${size}" -lt 5000000 ]; then
            echo "${archive} is ${size} bytes — that is a placeholder, not the SDK" >&2
            exit 1
          fi
          nm -g "${archive}" > ios-symbols.txt
          for symbol in _Grapple_CreateEngine _Grapple_OpenLuaBindings _SDL_CreateWindow; do
            if ! grep -qE "[ST] ${symbol}$" ios-symbols.txt; then
              echo "Missing ${symbol} — the iOS archive is not carrying the engine" >&2
              exit 1
            fi
          done

  ios:
    name: iOS (XCFramework / simulator)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 35

    # CI iteration profile: Release only, simulator slice arm64-only (runners
    # are arm64). The release workflow builds the full fat simulator slice.
    env:
      GRAPPLE_BEAM_IOS_SIMULATOR_ARCHS: arm64

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install latest CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: latest
          ninjaVersion: latest

      - name: Build Release XCFramework and consumer apps
        run: |
          bash scripts/build_ios_xcframework.sh Release build/ios/release
          bash scripts/build_ios_test_apps.sh \
            build/ios/release/grapple-beam.xcframework Release build/ios/consumer-release

      - name: Run Release package tests in iOS Simulator
        env:
          BUILD_DIR: build/ios/consumer-release/iphonesimulator
        run: bash scripts/run_ios_tests.sh

      - name: Stage iOS package metadata
        id: ios_package
        run: |
          version="$(tr -d '[:space:]' < VERSION | sed 's/^v//;s/^V//;s/#.*//')"
          echo "artifact_name=grapple-beam-ios-xcframework-release-${version}" >> "${GITHUB_OUTPUT}"
          echo "artifact_path=build/ios/release/grapple-beam-ios-xcframework-release-${version}.zip" >> "${GITHUB_OUTPUT}"

      - name: Upload iOS package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.ios_package.outputs.artifact_name }}
          path: ${{ steps.ios_package.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 14
