name: Desktop CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
      - name: Build tools
        run: python -m pip install cmake==3.31.6 ninja==1.11.1.4 clang-format==19.1.7
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libasound2-dev libpulse-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libudev-dev libwayland-dev libdecor-0-dev libpipewire-0.3-dev
          Xvfb :99 -screen 0 1280x720x24 > /tmp/xvfb.log 2>&1 &
          echo DISPLAY=:99 >> "$GITHUB_ENV"
      - name: Format verification
        run: cmake -DCHECK=ON -P cmake/Format.cmake
      - name: Debug and Release
        run: |
          cmake --preset debug
          cmake --build --preset debug --parallel 4
          ctest --preset debug
          cmake --preset release
          cmake --build --preset release --parallel 4
          ctest --preset release
      - name: Linux sanitizer coverage
        if: runner.os == 'Linux'
        run: |
          cmake --preset sanitizer
          cmake --build --preset sanitizer --parallel 4
          ctest --preset sanitizer
      - name: Source-build packaging CLI
        run: python scripts/build-cli.py
      - name: Package and validate
        run: ./build/cli/bin/grapple-beam package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: desktop-${{ matrix.os }}
          path: |
            dist/*
            build/*/Testing/Temporary/*.log
          if-no-files-found: warn
