<!doctype html>
<!-- Minimal game shell for Emscripten builds (--shell-file). The canvas fills
     the viewport; Module.status text shows load progress. Customize freely. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>grapple-beam</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #101418;
      color: #e0e0e0;
      font-family: monospace;
      overflow: hidden;
    }
    #canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      image-rendering: pixelated;
    }
    #status {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 14px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  <div id="status">loading grapple-beam…</div>
  <script>
    var statusElement = document.getElementById('status');
    var Module = {
      canvas: document.getElementById('canvas'),
      setStatus: function (text) {
        statusElement.textContent = text;
        statusElement.style.display = text ? 'block' : 'none';
      },
      onRuntimeInitialized: function () {
        Module.setStatus('');
      }
    };
    Module.setStatus('loading grapple-beam…');
  </script>
  {{{ SCRIPT }}}
</body>
</html>
